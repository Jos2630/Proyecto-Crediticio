<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Sistema de Gestión de Créditos</title>

    <!-- Bootstrap 5: estilos del frontend -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <style>
        :root {
            --azul-principal: #0756a5;
            --azul-oscuro: #063b70;
            --azul-boton: #0875e1;
            --fondo: #eaf3fc;
            --texto: #152a43;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--texto);
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(135deg, rgba(255,255,255,.78), rgba(220,236,252,.86)),
                var(--fondo);
        }

        .pagina-login {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .barra-superior {
            min-height: 58px;
            display: flex;
            align-items: center;
            padding: 12px 5%;
            color: #fff;
            background: linear-gradient(90deg, var(--azul-oscuro), var(--azul-principal));
            box-shadow: 0 2px 8px rgba(10, 43, 78, .18);
        }

        .marca-superior {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            letter-spacing: .2px;
        }

        .marca-superior svg {
            width: 27px;
            height: 27px;
            flex-shrink: 0;
        }

        .contenido-principal {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .tarjeta-login {
            width: 100%;
            max-width: 430px;
            padding: 34px 36px 30px;
            background: rgba(255, 255, 255, .97);
            border: 1px solid #d9e6f4;
            border-radius: 15px;
            box-shadow: 0 18px 48px rgba(24, 67, 112, .13);
        }

        .icono-banco {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: var(--azul-principal);
            background: #e7f1ff;
            border-radius: 18px;
        }

        .icono-banco svg {
            width: 49px;
            height: 49px;
        }

        .titulo-sistema {
            margin: 0;
            color: #102b4c;
            font-size: 1.55rem;
            font-weight: 750;
            line-height: 1.25;
            text-align: center;
        }

        .subtitulo {
            margin: 10px 0 25px;
            color: #63758b;
            font-size: .94rem;
            text-align: center;
        }

        .form-label {
            margin-bottom: 7px;
            font-size: .92rem;
            font-weight: 600;
        }

        .campo-icono {
            position: relative;
        }

        .campo-icono svg {
            position: absolute;
            top: 50%;
            left: 13px;
            width: 19px;
            height: 19px;
            color: #54718f;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .campo-icono .form-control {
            min-height: 47px;
            padding-left: 43px;
            border-color: #cbd9e8;
            border-radius: 8px;
        }

        .campo-icono .form-control:focus {
            border-color: #5b9ee8;
            box-shadow: 0 0 0 .2rem rgba(8, 117, 225, .13);
        }

        .boton-login {
            min-height: 47px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--azul-boton), #0864c6);
            font-weight: 700;
            box-shadow: 0 5px 12px rgba(8, 100, 198, .16);
        }

        .boton-login:hover,
        .boton-login:focus {
            background: #0758ac;
        }

        .nota-seguridad {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 20px;
            color: #63758b;
            font-size: .82rem;
            text-align: center;
        }

        .nota-seguridad svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .pie-pagina {
            padding: 16px;
            color: #60748b;
            font-size: .82rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            .barra-superior {
                padding-inline: 18px;
            }

            .tarjeta-login {
                padding: 28px 22px 24px;
            }

            .titulo-sistema {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>
    <div class="pagina-login">
        <header class="barra-superior">
            <div class="marca-superior">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M3 9h18L12 3 3 9Z"></path>
                    <path d="M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18M2 22h20"></path>
                </svg>
                <span>Sistema de Gestión de Créditos</span>
            </div>
        </header>

        <main class="contenido-principal">
            <section class="tarjeta-login" aria-labelledby="titulo-login">
                <div class="icono-banco" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9h18L12 3 3 9Z"></path>
                        <path d="M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18M2 22h20"></path>
                    </svg>
                </div>

                <h1 id="titulo-login" class="titulo-sistema">
                    Sistema de Gestión<br>de Créditos
                </h1>
                <p class="subtitulo">Acceso para el personal de la entidad bancaria</p>

                <!-- Interfaz visual solamente. El compañero conectará el formulario con PHP. -->
                <form action="#" method="post">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <div class="campo-icono">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                            </svg>
                            <input
                                type="text"
                                class="form-control"
                                id="usuario"
                                name="usuario"
                                placeholder="Ingresa tu usuario"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <div class="campo-icono">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true">
                                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"></path>
                            </svg>
                            <input
                                type="password"
                                class="form-control"
                                id="contrasena"
                                name="contrasena"
                                placeholder="Ingresa tu contraseña"
                                autocomplete="current-password"
                                required
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary boton-login w-100">
                        Iniciar sesión
                    </button>
                </form>

                <div class="nota-seguridad">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                        <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <span>Acceso exclusivo para usuarios autorizados</span>
                </div>
            </section>
        </main>

        <footer class="pie-pagina">
            Sistema de Gestión de Créditos &copy; 2026
        </footer>
    </div>
</body>
</html>
